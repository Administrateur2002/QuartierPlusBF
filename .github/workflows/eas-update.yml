name: EAS Update (OTA)

on:
  workflow_dispatch:
    inputs:
      message:
        description: Message pour la mise à jour EAS
        type: string
        required: false
        default: ""

jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Vérifier la configuration et réveiller l’API
        env:
          EXPO_PUBLIC_FIREBASE_API_KEY: ${{ vars.EXPO_PUBLIC_FIREBASE_API_KEY || secrets.EXPO_PUBLIC_FIREBASE_API_KEY }}
          EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ vars.EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN || secrets.EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN }}
          EXPO_PUBLIC_FIREBASE_PROJECT_ID: ${{ vars.EXPO_PUBLIC_FIREBASE_PROJECT_ID || secrets.EXPO_PUBLIC_FIREBASE_PROJECT_ID }}
          EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID || secrets.EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
          EXPO_PUBLIC_FIREBASE_MEASUREMENT_ID: ${{ vars.EXPO_PUBLIC_FIREBASE_MEASUREMENT_ID || secrets.EXPO_PUBLIC_FIREBASE_MEASUREMENT_ID }}
          EXPO_PUBLIC_GOOGLE_MAPS_API_KEY: ${{ vars.EXPO_PUBLIC_GOOGLE_MAPS_API_KEY || secrets.EXPO_PUBLIC_GOOGLE_MAPS_API_KEY }}
          EXPO_PUBLIC_API_URL: ${{ vars.EXPO_PUBLIC_API_URL || secrets.EXPO_PUBLIC_API_URL || 'https://quartierplus-api.onrender.com' }}
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          GOOGLE_SERVICES_JSON_B64: ${{ secrets.GOOGLE_SERVICES_JSON_B64 }}
          GITHUB_EXPO_PUBLIC_EAS_PROJECT_ID: ${{ vars.EXPO_PUBLIC_EAS_PROJECT_ID || secrets.EXPO_PUBLIC_EAS_PROJECT_ID }}
          EXPO_PUBLIC_EAS_PROJECT_ID_SOURCE: ${{ vars.EXPO_PUBLIC_EAS_PROJECT_ID != '' && 'variable GitHub' || secrets.EXPO_PUBLIC_EAS_PROJECT_ID != '' && 'secret GitHub' || 'absente' }}
          EXPO_PUBLIC_LIVEKIT_URL: ${{ vars.EXPO_PUBLIC_LIVEKIT_URL || secrets.EXPO_PUBLIC_LIVEKIT_URL || 'wss://quartierplus-98gp8fx8.livekit.cloud' }}
        run: |
          GOOGLE_CLIENT_IDS="$(node <<'NODE'
          const fs = require("node:fs");
          const file = "mobile/google-services.json";
          const packageName = require("./mobile/app.json").expo?.android?.package;
          const normalize = (value) =>
            value
              .replace(/[\p{Cf}\uFEFF]/gu, "")
              .replace(/\r\n?/g, "\n")
              .replace(/[“”‘’]/g, '"')
              .trim();
          const decodeBase64 = (value) => {
            const compact = value.replace(/\s/gu, "");
            if (
              !compact ||
              !/^(?:[A-Za-z0-9+/]{4})*(?:[A-Za-z0-9+/]{2}(?:==)?|[A-Za-z0-9+/]{3}=?)?$/.test(compact) ||
              compact.replace(/=+$/, "").length % 4 === 1
            ) {
              return null;
            }
            const bytes = Buffer.from(compact, "base64");
            if (bytes.toString("base64").replace(/=+$/, "") !== compact.replace(/=+$/, "")) {
              return null;
            }
            try {
              return new TextDecoder("utf-8", { fatal: true }).decode(bytes);
            } catch {
              return null;
            }
          };
          const parseCandidate = (raw) => {
            let contents = normalize(raw);
            let config;
            for (let attempt = 0; attempt < 2; attempt += 1) {
              try {
                config = JSON.parse(contents);
              } catch {
                const quote = contents[0];
                const matchingQuote = new Map([["'", "'"], ['"', '"']]).get(quote);
                if (
                  attempt > 0 ||
                  !matchingQuote ||
                  contents.length < 2 ||
                  contents.at(-1) !== matchingQuote
                ) {
                  return null;
                }
                contents = contents.slice(1, -1).trim();
                continue;
              }
              if (typeof config === "string") {
                contents = normalize(config);
                config = undefined;
                continue;
              }
              break;
            }
            if (
              !config ||
              typeof config !== "object" ||
              Array.isArray(config) ||
              typeof config.project_info?.project_id !== "string" ||
              typeof config.project_info?.project_number !== "string" ||
              !Array.isArray(config.client)
            ) {
              return null;
            }
            const oauthClients = config.client.flatMap((client) =>
              client && Array.isArray(client.oauth_client) ? client.oauth_client : [],
            );
            const androidClient = oauthClients.find(
              (client) =>
                client?.client_type === 1 &&
                client.android_info?.package_name === packageName &&
                typeof client.client_id === "string" &&
                client.client_id.trim(),
            );
            return androidClient ? { contents, config, androidClient } : null;
          };
          const candidates = [];
          const encoded = process.env.GOOGLE_SERVICES_JSON_B64?.trim();
          const raw = process.env.GOOGLE_SERVICES_JSON?.trim();
          if (encoded) {
            const decoded = decodeBase64(encoded);
            if (decoded !== null) candidates.push({ source: "GOOGLE_SERVICES_JSON_B64", raw: decoded });
            candidates.push({ source: "GOOGLE_SERVICES_JSON_B64", raw: encoded });
          }
          if (raw) {
            candidates.push({ source: "GOOGLE_SERVICES_JSON", raw });
            const decoded = decodeBase64(raw);
            if (decoded !== null) candidates.push({ source: "GOOGLE_SERVICES_JSON", raw: decoded });
          }
          try {
            candidates.push({ source: "fichier du dépôt", raw: fs.readFileSync(file, "utf8") });
          } catch (error) {
            if (error.code !== "ENOENT") throw error;
          }

          let selected;
          for (const candidate of candidates) {
            const result = parseCandidate(candidate.raw);
            if (result) {
              selected = { ...candidate, ...result };
              break;
            }
          }
          if (!selected) {
            console.error(`::error::Aucune configuration Firebase Android valide : les secrets fournis et ${file} sont absents, invalides ou incompatibles; contenu masqué.`);
            process.exit(1);
          }
          if (selected.source !== "fichier du dépôt") {
            fs.writeFileSync(file, selected.contents, { mode: 0o600 });
            fs.chmodSync(file, 0o600);
          } else if (encoded || raw) {
            console.error("Configuration Firebase des secrets invalide ou incompatible; utilisation du fichier valide du dépôt.");
          }
          console.error(`Configuration Firebase utilisée : ${selected.source}.`);

          const config = selected.config;
          const androidClient = selected.androidClient;
          const oauthClients = config.client.flatMap((client) =>
            client && Array.isArray(client.oauth_client) ? client.oauth_client : [],
          );
          const webClient = oauthClients.find(
            (client) =>
              client &&
              client.client_type === 3 &&
              typeof client.client_id === "string" &&
              client.client_id.trim(),
          );

          if (!androidClient) {
            console.error(
              `::error::Client OAuth Android client_type 1 absent de ${file} pour le package ${packageName ?? "absent"}.`,
            );
            process.exit(1);
          }
          const androidId = androidClient.client_id.trim();
          const webId = webClient?.client_id.trim() ?? "";

          fs.appendFileSync(
            process.env.GITHUB_ENV,
            `EXPO_PUBLIC_GOOGLE_ANDROID_CLIENT_ID=${androidId}\nEXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID=${webId}\n`,
          );
          console.error(`EXPO_PUBLIC_GOOGLE_ANDROID_CLIENT_ID source: ${file}`);
          console.error(
            `EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID source: ${webClient ? file : `absente de ${file}`}`,
          );
          process.stdout.write(`${androidId}\n${webId}`);
          NODE
          )" || exit 1
          IFS=$'\n' read -r EXPO_PUBLIC_GOOGLE_ANDROID_CLIENT_ID EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID <<< "$GOOGLE_CLIENT_IDS"
          export EXPO_PUBLIC_GOOGLE_ANDROID_CLIENT_ID EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID

          APP_EAS_PROJECT_ID="$(node -p "require('./mobile/app.json').expo?.extra?.eas?.projectId?.trim() ?? ''")"
          if [ -n "$APP_EAS_PROJECT_ID" ]; then
            export EXPO_PUBLIC_EAS_PROJECT_ID="$APP_EAS_PROJECT_ID"
            EAS_PROJECT_ID_SOURCE="app.json"
          else
            export EXPO_PUBLIC_EAS_PROJECT_ID="$GITHUB_EXPO_PUBLIC_EAS_PROJECT_ID"
            EAS_PROJECT_ID_SOURCE="$EXPO_PUBLIC_EAS_PROJECT_ID_SOURCE"
          fi
          echo "EXPO_PUBLIC_EAS_PROJECT_ID source: $EAS_PROJECT_ID_SOURCE"

          MISSING_CONFIG=""
          for name in EXPO_PUBLIC_API_URL EXPO_PUBLIC_FIREBASE_PROJECT_ID EXPO_PUBLIC_GOOGLE_MAPS_API_KEY EXPO_PUBLIC_GOOGLE_ANDROID_CLIENT_ID; do
            if [ -z "$(printenv "$name" | tr -d '[:space:]')" ]; then
              MISSING_CONFIG="$MISSING_CONFIG $name"
            fi
          done
          if [ -n "$MISSING_CONFIG" ]; then
            echo "::error::Configuration absente ou vide :$MISSING_CONFIG."
            exit 1
          fi

          API_HOST="$(node -e '
            const value = process.env.EXPO_PUBLIC_API_URL;
            if (!value.startsWith("https://") || value.endsWith("/") || /\/health|\/api|invalid/i.test(value)) {
              console.error("::error::EXPO_PUBLIC_API_URL doit être une URL HTTPS valide, sans /health ni /api.");
              process.exit(1);
            }
            try {
              const url = new URL(value);
              if (url.protocol !== "https:" || !url.hostname) throw new Error();
              process.stdout.write(url.host);
            } catch {
              console.error("::error::EXPO_PUBLIC_API_URL n’est pas une URL HTTPS valide.");
              process.exit(1);
            }
          ')" || exit 1

          if ! node -e '
            const id = process.env.EXPO_PUBLIC_EAS_PROJECT_ID ?? "";
            const isUuid = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(id);
            const isAllZero = /^0{8}-0{4}-0{4}-0{4}-0{12}$/.test(id);
            if (!id || !isUuid || isAllZero) {
              console.error("::error::Identifiant EAS absent ou factice dans app.json et EXPO_PUBLIC_EAS_PROJECT_ID.");
              process.exit(1);
            }
          '; then
            exit 1
          fi

          RESPONSE_FILE="$(mktemp)"
          trap 'rm -f "$RESPONSE_FILE"' EXIT
          for attempt in 1 2 3 4 5 6; do
            HTTP_CODE="$(curl --silent --output "$RESPONSE_FILE" --write-out '%{http_code}' --max-time 15 "$EXPO_PUBLIC_API_URL/health" || true)"
            HTTP_CODE="${HTTP_CODE:-000}"
            echo "Hôte : $API_HOST — HTTP $HTTP_CODE"
            if [ "$HTTP_CODE" = "200" ] && node -e '
              try {
                process.exit(JSON.parse(require("node:fs").readFileSync(process.argv[1], "utf8")).status === "ok" ? 0 : 1);
              } catch {
                process.exit(1);
              }
            ' "$RESPONSE_FILE"; then
              LEGAL_HTTP_CODE="$(curl --silent --output "$RESPONSE_FILE" --write-out '%{http_code}' --max-time 15 "$EXPO_PUBLIC_API_URL/v1/legal/documents" || true)"
              LEGAL_HTTP_CODE="${LEGAL_HTTP_CODE:-000}"
              echo "Route des documents légaux : HTTP $LEGAL_HTTP_CODE"
              if [ "$LEGAL_HTTP_CODE" = "200" ] && node -e '
                try {
                  const documents = JSON.parse(require("node:fs").readFileSync(process.argv[1], "utf8")).documents;
                  process.exit(Array.isArray(documents) && documents.length === 6 && documents.every((document) =>
                    typeof document?.id === "string" && typeof document?.version === "string"
                  ) ? 0 : 1);
                } catch {
                  process.exit(1);
                }
              ' "$RESPONSE_FILE"; then
                exit 0
              fi
            fi
            if [ "$attempt" -lt 6 ]; then sleep 20; fi
          done
          echo "::error::L’API ou GET /v1/legal/documents n’a pas répondu avec le contrat attendu après 6 tentatives."
          exit 1

      - name: Installer EAS CLI
        run: npm install --global eas-cli

      - name: Charger la configuration Google iOS depuis EAS si nécessaire
        working-directory: mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          GITHUB_EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID: ${{ vars.EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID || secrets.EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID }}
        run: |
          if [ -z "$(printenv EXPO_TOKEN | tr -d '[:space:]')" ]; then
            echo "::error::Le secret EXPO_TOKEN est absent."
            exit 1
          fi

          eas env:exec --environment preview "node -e '
            const fs = require(\"node:fs\");
            const githubId = process.env.GITHUB_EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID?.trim();
            const easId = process.env.EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID?.trim();
            const clientId = githubId || easId;
            const valid = /^[0-9]+-[a-zA-Z0-9-]+\\.apps\\.googleusercontent\\.com$/.test(clientId ?? \"\");

            if (clientId && !valid) {
              console.error(\"::warning::EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID est invalide; Google Sign-In iOS ne sera pas configuré.\");
              process.exit(0);
            }
            if (clientId) {
              fs.appendFileSync(process.env.GITHUB_ENV, \"EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID=\" + clientId + \"\\n\");
              console.log(\"EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID source: \" + (githubId ? \"GitHub Actions\" : \"EAS preview\"));
            } else {
              console.log(\"::warning::EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID absent de GitHub Actions et EAS preview; publication Android sans Google Sign-In iOS.\");
            }
          '"

      - name: Installer les dépendances mobile
        working-directory: mobile
        run: npm ci

      - name: Valider l’export JavaScript Android
        timeout-minutes: 6
        working-directory: mobile
        env:
          EXPO_PUBLIC_FIREBASE_API_KEY: ${{ vars.EXPO_PUBLIC_FIREBASE_API_KEY || secrets.EXPO_PUBLIC_FIREBASE_API_KEY }}
          EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ vars.EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN || secrets.EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN }}
          EXPO_PUBLIC_FIREBASE_PROJECT_ID: ${{ vars.EXPO_PUBLIC_FIREBASE_PROJECT_ID || secrets.EXPO_PUBLIC_FIREBASE_PROJECT_ID }}
          EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID || secrets.EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
          EXPO_PUBLIC_FIREBASE_MEASUREMENT_ID: ${{ vars.EXPO_PUBLIC_FIREBASE_MEASUREMENT_ID || secrets.EXPO_PUBLIC_FIREBASE_MEASUREMENT_ID }}
          EXPO_PUBLIC_GOOGLE_MAPS_API_KEY: ${{ vars.EXPO_PUBLIC_GOOGLE_MAPS_API_KEY || secrets.EXPO_PUBLIC_GOOGLE_MAPS_API_KEY }}
          EXPO_PUBLIC_API_URL: ${{ vars.EXPO_PUBLIC_API_URL || secrets.EXPO_PUBLIC_API_URL || 'https://quartierplus-api.onrender.com' }}
          GITHUB_EXPO_PUBLIC_EAS_PROJECT_ID: ${{ vars.EXPO_PUBLIC_EAS_PROJECT_ID || secrets.EXPO_PUBLIC_EAS_PROJECT_ID }}
          EXPO_PUBLIC_LIVEKIT_URL: ${{ vars.EXPO_PUBLIC_LIVEKIT_URL || secrets.EXPO_PUBLIC_LIVEKIT_URL || 'wss://quartierplus-98gp8fx8.livekit.cloud' }}
          EXPO_PUBLIC_GIT_SHA: ${{ github.sha }}
        run: |
          APP_EAS_PROJECT_ID="$(node -p "require('./app.json').expo?.extra?.eas?.projectId?.trim() ?? ''")"
          if [ -n "$APP_EAS_PROJECT_ID" ]; then
            export EXPO_PUBLIC_EAS_PROJECT_ID="$APP_EAS_PROJECT_ID"
          else
            export EXPO_PUBLIC_EAS_PROJECT_ID="$GITHUB_EXPO_PUBLIC_EAS_PROJECT_ID"
          fi
          timeout --kill-after=3s 180s npx expo export --platform android --output-dir "$RUNNER_TEMP/qp-update-export"

      - name: Publier sur la branche preview
        working-directory: mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXPO_PUBLIC_FIREBASE_API_KEY: ${{ vars.EXPO_PUBLIC_FIREBASE_API_KEY || secrets.EXPO_PUBLIC_FIREBASE_API_KEY }}
          EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ vars.EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN || secrets.EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN }}
          EXPO_PUBLIC_FIREBASE_PROJECT_ID: ${{ vars.EXPO_PUBLIC_FIREBASE_PROJECT_ID || secrets.EXPO_PUBLIC_FIREBASE_PROJECT_ID }}
          EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID || secrets.EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
          EXPO_PUBLIC_FIREBASE_MEASUREMENT_ID: ${{ vars.EXPO_PUBLIC_FIREBASE_MEASUREMENT_ID || secrets.EXPO_PUBLIC_FIREBASE_MEASUREMENT_ID }}
          EXPO_PUBLIC_GOOGLE_MAPS_API_KEY: ${{ vars.EXPO_PUBLIC_GOOGLE_MAPS_API_KEY || secrets.EXPO_PUBLIC_GOOGLE_MAPS_API_KEY }}
          EXPO_PUBLIC_API_URL: ${{ vars.EXPO_PUBLIC_API_URL || secrets.EXPO_PUBLIC_API_URL || 'https://quartierplus-api.onrender.com' }}
          GITHUB_EXPO_PUBLIC_EAS_PROJECT_ID: ${{ vars.EXPO_PUBLIC_EAS_PROJECT_ID || secrets.EXPO_PUBLIC_EAS_PROJECT_ID }}
          EXPO_PUBLIC_LIVEKIT_URL: ${{ vars.EXPO_PUBLIC_LIVEKIT_URL || secrets.EXPO_PUBLIC_LIVEKIT_URL || 'wss://quartierplus-98gp8fx8.livekit.cloud' }}
          EXPO_PUBLIC_GIT_SHA: ${{ github.sha }}
          UPDATE_MESSAGE: ${{ inputs.message || format('Manual EAS update from {0}', github.sha) }}
        run: |
          APP_EAS_PROJECT_ID="$(node -p "require('./app.json').expo?.extra?.eas?.projectId?.trim() ?? ''")"
          if [ -n "$APP_EAS_PROJECT_ID" ]; then
            export EXPO_PUBLIC_EAS_PROJECT_ID="$APP_EAS_PROJECT_ID"
          else
            export EXPO_PUBLIC_EAS_PROJECT_ID="$GITHUB_EXPO_PUBLIC_EAS_PROJECT_ID"
          fi

          for profile in preview-arm64 preview-armv7; do
            if [ "$profile" = "preview-arm64" ]; then
              architecture="arm64-v8a"
            else
              architecture="armeabi-v7a"
            fi
            BUILD_LIST="$(eas build:list --platform android --status finished --build-profile "$profile" --limit 1 --json --non-interactive)"
            BUILD_METADATA="$(BUILD_LIST="$BUILD_LIST" node -e '
              try {
                const builds = JSON.parse(process.env.BUILD_LIST);
                const build = (Array.isArray(builds) ? builds : [builds])[0];
                if (!build?.fingerprint?.hash || !build?.gitCommitHash) throw new Error();
                process.stdout.write(`${build.fingerprint.hash}\n${build.gitCommitHash}`);
              } catch {
                console.error(`::error::Empreinte native absente pour ${process.argv[1]}; impossible de garantir la compatibilité OTA. Lancez manuellement « Build Android Preview APK ».`);
                process.exit(1);
              }
            ' "$profile")"
            BASELINE_FINGERPRINT="${BUILD_METADATA%%$'\n'*}"
            EXPO_PUBLIC_GIT_SHA="${BUILD_METADATA#*$'\n'}"
            export EXPO_PUBLIC_GIT_SHA
            CURRENT_FINGERPRINT="$(EXPO_ANDROID_BUILD_ARCHS="$architecture" EXPO_ANDROID_MINIFY=false node <<'NODE'
          const { createFingerprintAsync } = require("@expo/fingerprint");
          createFingerprintAsync(process.cwd(), { platforms: ["android"], silent: true })
            .then(({ hash }) => process.stdout.write(hash))
            .catch((error) => {
              console.error("::error::Impossible de calculer l’empreinte native Android actuelle.", error);
              process.exitCode = 1;
            });
          NODE
          )"
            if [ "$BASELINE_FINGERPRINT" != "$CURRENT_FINGERPRINT" ]; then
              echo "::error::Les dépendances natives, plugins, permissions ou la configuration Android diffèrent du dernier APK ($profile). Une mise à jour OTA ne suffit pas : lancez manuellement le workflow « Build Android Preview APK », puis relancez EAS Update."
              exit 1
            fi
          done

          eas update \
            --branch preview \
            --environment preview \
            --platform android \
            --message "$UPDATE_MESSAGE" \
            --non-interactive
