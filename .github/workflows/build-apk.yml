name: Build Android Preview APK

on:
  workflow_dispatch:

concurrency:
  group: build-android-preview-apk
  cancel-in-progress: false

jobs:
  build:
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - name: 🏗 Checkout repo
        uses: actions/checkout@v5

      - name: Restore Firebase Android configuration
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          GOOGLE_SERVICES_JSON_B64: ${{ secrets.GOOGLE_SERVICES_JSON_B64 }}
        run: |
          node <<'NODE'
          const fs = require("node:fs");
          const encoded = process.env.GOOGLE_SERVICES_JSON_B64?.trim();
          const raw = encoded
            ? Buffer.from(encoded.replace(/\s+/g, ""), "base64").toString("utf8")
            : process.env.GOOGLE_SERVICES_JSON;
          if (!raw) {
            console.error("::error::Les secrets GOOGLE_SERVICES_JSON et GOOGLE_SERVICES_JSON_B64 sont absents.");
            process.exit(1);
          }

          const hadBom = raw.includes("\uFEFF");
          const hadTypographicQuotes = /[\u2018\u2019\u201C\u201D]/.test(raw);
          let contents = raw.replace(/\r\n?/g, "\n").replace(/^\uFEFF+/, "").trim();
          const enclosingQuotes = new Map([['"', '"'], ["'", "'"], ["“", "”"], ["‘", "’"]]);
          while (
            contents.length >= 2 &&
            enclosingQuotes.get(contents[0]) === contents.at(-1)
          ) {
            contents = contents.slice(1, -1).trim();
          }
          contents = contents.replace(/[“”‘’]/g, '"');

          try {
            JSON.parse(contents);
          } catch (error) {
            const positionMatch = error.message.match(/position\s+(\d+)/i);
            const lineColumnMatch = error.message.match(/line\s+(\d+)\s+column\s+(\d+)/i);
            const frenchKeys = [
              ["project_number", "numéro_de_projet"],
              ["project_id", "identifiant_du_projet"],
              ["firebase_url", "url_firebase"],
              ["storage_bucket", "compartiment_de_stockage"],
              ["package_name", "nom_du_package"],
              ["mobilesdk_app_id", "identifiant_application_mobile_sdk"],
              ["client_id", "identifiant_client"],
              ["current_key", "clé_api"],
              ["oauth_client", "clients_oauth"],
            ];
            const presentKeys = frenchKeys
              .filter(([key]) => new RegExp(`["']?${key}["']?\\s*:`).test(contents))
              .map(([, label]) => label);
            const describeCharacter = (character) => {
              const labels = new Map([
                ["{", "accolade_ouvrante"],
                ["}", "accolade_fermante"],
                ["[", "crochet_ouvrant"],
                ["]", "crochet_fermant"],
                ['"', "guillemet_double"],
                ["'", "apostrophe"],
                [" ", "espace"],
                ["\n", "retour_ligne"],
                ["\t", "tabulation"],
                ["\uFEFF", "BOM"],
              ]);
              return character
                ? `${labels.get(character) ?? "autre"} (U+${character.codePointAt(0).toString(16).toUpperCase().padStart(4, "0")})`
                : "vide";
            };
            const position = positionMatch?.[1] ??
              (lineColumnMatch
                ? String(
                    contents
                      .split(/\r\n|\r|\n/)
                      .slice(0, Number(lineColumnMatch[1]) - 1)
                      .reduce((total, line) => total + line.length + 1, 0) +
                      Number(lineColumnMatch[2]) -
                      1,
                  )
                : "indisponible");
            console.error("::error::Le secret de configuration Firebase Android n’est pas un JSON valide.");
            console.error(`Diagnostic sans contenu : longueur_brute=${raw.length}, longueur_normalisée=${contents.length}, premier_caractère=${describeCharacter(raw[0])}, dernier_caractère=${describeCharacter(raw.at(-1))}, BOM=${hadBom ? "oui" : "non"}, guillemets_typographiques=${hadTypographicQuotes ? "oui" : "non"}, clés_reconnues=${presentKeys.length ? presentKeys.join(",") : "aucune"}.`);
            console.error(`Erreur de syntaxe JSON (position ${position}; texte du parseur masqué).`);
            process.exit(1);
          }
          fs.writeFileSync("mobile/google-services.json", contents, { mode: 0o600 });
          NODE

      - name: Extract Google OAuth clients from Firebase configuration
        run: |
          node <<'NODE'
          const fs = require("node:fs");

          const file = "mobile/google-services.json";
          let config;
          try {
            config = JSON.parse(fs.readFileSync(file, "utf8"));
          } catch {
            console.error("::error::Le fichier mobile/google-services.json est invalide.");
            process.exit(1);
          }

          const root = config && typeof config === "object" ? config : {};
          const packageName = require("./mobile/app.json").expo?.android?.package;
          const oauthClients = (Array.isArray(root.client) ? root.client : []).flatMap(
            (client) => Array.isArray(client.oauth_client) ? client.oauth_client : [],
          );
          const androidClient = oauthClients.find(
            (client) =>
              client.client_type === 1 &&
              client.android_info?.package_name === packageName &&
              typeof client.client_id === "string" &&
              client.client_id.trim(),
          );
          const webClient = oauthClients.find(
            (client) =>
              client.client_type === 3 &&
              typeof client.client_id === "string" &&
              client.client_id.trim(),
          );
          const projectNumber = String(root.project_info?.project_number ?? "");
          const projectId = String(root.project_info?.project_id ?? "");

          console.log(`Chemin lu : ${file}`);
          console.log(`Entrées oauth_client : ${oauthClients.length}`);
          console.log(`package_name : ${packageName ?? "absent"}`);
          console.log(`project_number : ${projectNumber || "absent"}`);
          console.log(`project_id : ${projectId || "absent"}`);
          console.log(`Client Android (12 premiers caractères) : ${androidClient?.client_id.slice(0, 12) ?? "absent"}`);
          console.log(`Client Web (12 premiers caractères) : ${webClient?.client_id.slice(0, 12) ?? "absent"}`);

          if (!androidClient) {
            console.error(
              `::error::Client OAuth Android client_type 1 absent de ${file} pour le package ${packageName ?? "absent"}.`,
            );
            process.exit(1);
          }

          const env = [
            ["EXPO_PUBLIC_GOOGLE_ANDROID_CLIENT_ID", androidClient.client_id.trim()],
            ["EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID", webClient?.client_id.trim() ?? ""],
            ["EXPO_PUBLIC_FIREBASE_PROJECT_ID", projectId],
            ["FIREBASE_PROJECT_NUMBER", projectNumber],
            ["FIREBASE_PROJECT_ID", projectId],
          ];
          fs.appendFileSync(
            process.env.GITHUB_ENV,
            `${env.map(([name, value]) => `${name}=${value}`).join("\n")}\n`,
          );
          for (const [name] of env) {
            const origin =
              name === "EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID" && !webClient
                ? "absente de google-services.json"
                : "google-services.json";
            console.log(`${name} origine finale : ${origin}`);
          }
          NODE

      - name: 🔎 Vérifier l’URL et la disponibilité de l’API
        env:
          EXPO_PUBLIC_API_URL: ${{ vars.EXPO_PUBLIC_API_URL || secrets.EXPO_PUBLIC_API_URL || 'https://quartierplus-api.onrender.com' }}
          EXPO_PUBLIC_GOOGLE_MAPS_API_KEY: ${{ vars.EXPO_PUBLIC_GOOGLE_MAPS_API_KEY || secrets.EXPO_PUBLIC_GOOGLE_MAPS_API_KEY }}
        run: |
          MISSING_CONFIG=""
          for name in EXPO_PUBLIC_API_URL EXPO_PUBLIC_FIREBASE_PROJECT_ID EXPO_PUBLIC_GOOGLE_MAPS_API_KEY; do
            if [ -z "$(printenv "$name" | tr -d '[:space:]')" ]; then
              MISSING_CONFIG="$MISSING_CONFIG $name"
            fi
          done
          if [ -n "$MISSING_CONFIG" ]; then
            echo "::error::Configuration de build absente ou vide :$MISSING_CONFIG."
            exit 1
          fi

          API_HOST="$(node -e '
            const value = process.env.EXPO_PUBLIC_API_URL;
            if (!value.startsWith("https://")) {
              console.error("::error::EXPO_PUBLIC_API_URL doit commencer par https://.");
              process.exit(1);
            }
            if (value.endsWith("/")) {
              console.error("::error::EXPO_PUBLIC_API_URL ne doit pas se terminer par /.");
              process.exit(1);
            }
            if (/\/health|\/api|invalid/i.test(value)) {
              console.error("::error::EXPO_PUBLIC_API_URL ne doit contenir ni /health, ni /api, ni « invalid ».");
              process.exit(1);
            }
            try {
              const url = new URL(value);
              if (url.protocol !== "https:" || !url.hostname) throw new Error();
              process.stdout.write(url.host);
            } catch {
              console.error("::error::EXPO_PUBLIC_API_URL n’est pas une URL HTTPS valide.");
              process.exit(1);
            }
          ')" || exit 1
          RESPONSE_FILE="$(mktemp)"
          trap 'rm -f "$RESPONSE_FILE"' EXIT

          for attempt in 1 2 3 4 5 6; do
            HTTP_CODE="$(curl --silent --output "$RESPONSE_FILE" --write-out '%{http_code}' --max-time 15 "$EXPO_PUBLIC_API_URL/health" || true)"
            HTTP_CODE="${HTTP_CODE:-000}"
            echo "Hôte : $API_HOST — HTTP $HTTP_CODE"
            if [ "$HTTP_CODE" = "200" ] && node -e '
              try {
                process.exit(JSON.parse(require("node:fs").readFileSync(process.argv[1], "utf8")).status === "ok" ? 0 : 1);
              } catch {
                process.exit(1);
              }
            ' "$RESPONSE_FILE"; then
              exit 0
            fi
            if [ "$attempt" -lt 6 ]; then
              sleep 20
            fi
          done

          echo "::error::L’API n’a pas répondu avec HTTP 200 et status « ok » après 6 tentatives."
          exit 1

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: 📦 Install dependencies
        working-directory: mobile
        run: npm ci

      - name: Validate Firebase and app configuration
        env:
          EXPO_PUBLIC_API_URL: ${{ vars.EXPO_PUBLIC_API_URL || secrets.EXPO_PUBLIC_API_URL || 'https://quartierplus-api.onrender.com' }}
          EXPO_PUBLIC_GOOGLE_MAPS_API_KEY: ${{ vars.EXPO_PUBLIC_GOOGLE_MAPS_API_KEY || secrets.EXPO_PUBLIC_GOOGLE_MAPS_API_KEY }}
          GITHUB_EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID: ${{ vars.EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID || secrets.EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID }}
          GITHUB_EXPO_PUBLIC_EAS_PROJECT_ID: ${{ vars.EXPO_PUBLIC_EAS_PROJECT_ID || secrets.EXPO_PUBLIC_EAS_PROJECT_ID }}
          EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID_SOURCE: ${{ vars.EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID != '' && 'variable GitHub' || secrets.EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID != '' && 'secret GitHub' || 'absente' }}
          EXPO_PUBLIC_EAS_PROJECT_ID_SOURCE: ${{ vars.EXPO_PUBLIC_EAS_PROJECT_ID != '' && 'variable GitHub' || secrets.EXPO_PUBLIC_EAS_PROJECT_ID != '' && 'secret GitHub' || 'absente' }}
          EXPO_PUBLIC_LIVEKIT_URL: ${{ vars.EXPO_PUBLIC_LIVEKIT_URL || secrets.EXPO_PUBLIC_LIVEKIT_URL || 'wss://quartierplus-98gp8fx8.livekit.cloud' }}
        run: |
          if [ -n "$GITHUB_EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID" ]; then
            if [[ "$GITHUB_EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID" =~ ^[0-9]+-[a-zA-Z0-9-]+\.apps\.googleusercontent\.com$ ]]; then
              export EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID="$GITHUB_EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID"
            else
              echo "::warning::EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID invalide ; la connexion Google iOS ne sera pas configurée."
              unset EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID
            fi
          else
            unset EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID
            echo "::warning::EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID absent ; la connexion Google iOS ne sera pas configurée."
          fi
          APP_EAS_PROJECT_ID="$(node -p "require('./mobile/app.json').expo?.extra?.eas?.projectId?.trim() ?? ''")"
          if [ -n "$APP_EAS_PROJECT_ID" ]; then
            export EXPO_PUBLIC_EAS_PROJECT_ID="$APP_EAS_PROJECT_ID"
            EAS_PROJECT_ID_SOURCE="app.json"
          else
            export EXPO_PUBLIC_EAS_PROJECT_ID="$GITHUB_EXPO_PUBLIC_EAS_PROJECT_ID"
            EAS_PROJECT_ID_SOURCE="$EXPO_PUBLIC_EAS_PROJECT_ID_SOURCE"
          fi
          echo "EXPO_PUBLIC_EAS_PROJECT_ID source: $EAS_PROJECT_ID_SOURCE"
          if [ -n "$EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID" ]; then
            IOS_CLIENT_ID_SOURCE="$EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID_SOURCE"
          else
            IOS_CLIENT_ID_SOURCE="absente ou invalide"
          fi
          echo "EXPO_PUBLIC_GOOGLE_ANDROID_CLIENT_ID origine finale : google-services.json"
          echo "EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID origine finale : google-services.json"
          echo "EXPO_PUBLIC_FIREBASE_PROJECT_ID origine finale : google-services.json"
          echo "EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID origine finale : $IOS_CLIENT_ID_SOURCE"

          MISSING_CONFIG=""
          if ! printf '%s' "$EXPO_PUBLIC_FIREBASE_PROJECT_ID" | grep -q '[^[:space:]]'; then
            MISSING_CONFIG="$MISSING_CONFIG EXPO_PUBLIC_FIREBASE_PROJECT_ID"
          fi
          if ! printf '%s' "$EXPO_PUBLIC_API_URL" | grep -q '[^[:space:]]'; then
            MISSING_CONFIG="$MISSING_CONFIG EXPO_PUBLIC_API_URL"
          fi
          if ! printf '%s' "$EXPO_PUBLIC_GOOGLE_MAPS_API_KEY" | grep -q '[^[:space:]]'; then
            MISSING_CONFIG="$MISSING_CONFIG EXPO_PUBLIC_GOOGLE_MAPS_API_KEY"
          fi
          if [ -n "$MISSING_CONFIG" ]; then
            echo "::error::Configuration de build absente ou vide :$MISSING_CONFIG."
            exit 1
          fi
          if ! node -e '
            const id = process.env.EXPO_PUBLIC_EAS_PROJECT_ID ?? "";
            const isUuid = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(id);
            const isAllZero = /^0{8}-0{4}-0{4}-0{4}-0{12}$/.test(id);
            if (!id || !isUuid || isAllZero) {
              console.error("::error::Identifiant EAS absent ou factice : renseignez extra.eas.projectId dans app.json ou EXPO_PUBLIC_EAS_PROJECT_ID dans GitHub.");
              process.exit(1);
            }
          '; then
            exit 1
          fi
          if ! printf '%s' "$EXPO_PUBLIC_LIVEKIT_URL" | grep -q '[^[:space:]]'; then
            echo "::warning::EXPO_PUBLIC_LIVEKIT_URL absent ; les fonctionnalités LiveKit seront indisponibles."
          fi

      - name: Expo prebuild
        env:
          EXPO_PUBLIC_GIT_SHA: ${{ github.sha }}
          EXPO_PUBLIC_FIREBASE_API_KEY: ${{ vars.EXPO_PUBLIC_FIREBASE_API_KEY || secrets.EXPO_PUBLIC_FIREBASE_API_KEY }}
          EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ vars.EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN || secrets.EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN }}
          EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID || secrets.EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
          EXPO_PUBLIC_FIREBASE_MEASUREMENT_ID: ${{ vars.EXPO_PUBLIC_FIREBASE_MEASUREMENT_ID || secrets.EXPO_PUBLIC_FIREBASE_MEASUREMENT_ID }}
          EXPO_PUBLIC_GOOGLE_MAPS_API_KEY: ${{ vars.EXPO_PUBLIC_GOOGLE_MAPS_API_KEY || secrets.EXPO_PUBLIC_GOOGLE_MAPS_API_KEY }}
          EXPO_PUBLIC_API_URL: ${{ vars.EXPO_PUBLIC_API_URL || secrets.EXPO_PUBLIC_API_URL || 'https://quartierplus-api.onrender.com' }}
          GITHUB_EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID: ${{ vars.EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID || secrets.EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID }}
          EXPO_PUBLIC_EAS_PROJECT_ID: ${{ vars.EXPO_PUBLIC_EAS_PROJECT_ID || secrets.EXPO_PUBLIC_EAS_PROJECT_ID }}
          EXPO_PUBLIC_LIVEKIT_URL: ${{ vars.EXPO_PUBLIC_LIVEKIT_URL || secrets.EXPO_PUBLIC_LIVEKIT_URL || 'wss://quartierplus-98gp8fx8.livekit.cloud' }}
        run: |
          cd mobile
          if [ -n "$GITHUB_EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID" ]; then
            if [[ "$GITHUB_EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID" =~ ^[0-9]+-[a-zA-Z0-9-]+\.apps\.googleusercontent\.com$ ]]; then
              export EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID="$GITHUB_EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID"
            else
              unset EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID
            fi
          else
            unset EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID
          fi
          APP_EAS_PROJECT_ID="$(node -p "require('./app.json').expo?.extra?.eas?.projectId?.trim() ?? ''")"
          if [ -n "$APP_EAS_PROJECT_ID" ]; then
            export EXPO_PUBLIC_EAS_PROJECT_ID="$APP_EAS_PROJECT_ID"
          fi
          npx expo prebuild --clean --platform android

      - name: Configure Expo and EAS CLI
        uses: expo/expo-github-action@v9
        with:
          eas-version: latest
          packager: npm
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build on EAS and download the preview APK
        id: eas-build
        working-directory: mobile
        env:
          EXPO_PUBLIC_GIT_SHA: ${{ github.sha }}
          EXPO_PUBLIC_FIREBASE_API_KEY: ${{ vars.EXPO_PUBLIC_FIREBASE_API_KEY || secrets.EXPO_PUBLIC_FIREBASE_API_KEY }}
          EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ vars.EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN || secrets.EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN }}
          EXPO_PUBLIC_FIREBASE_APP_ID: ${{ vars.EXPO_PUBLIC_FIREBASE_APP_ID || secrets.EXPO_PUBLIC_FIREBASE_APP_ID }}
          EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID || secrets.EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
          EXPO_PUBLIC_FIREBASE_MEASUREMENT_ID: ${{ vars.EXPO_PUBLIC_FIREBASE_MEASUREMENT_ID || secrets.EXPO_PUBLIC_FIREBASE_MEASUREMENT_ID }}
          EXPO_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ vars.EXPO_PUBLIC_FIREBASE_STORAGE_BUCKET || secrets.EXPO_PUBLIC_FIREBASE_STORAGE_BUCKET }}
          EXPO_PUBLIC_API_URL: ${{ vars.EXPO_PUBLIC_API_URL || secrets.EXPO_PUBLIC_API_URL || 'https://quartierplus-api.onrender.com' }}
          EXPO_PUBLIC_GOOGLE_MAPS_API_KEY: ${{ vars.EXPO_PUBLIC_GOOGLE_MAPS_API_KEY || secrets.EXPO_PUBLIC_GOOGLE_MAPS_API_KEY }}
          GITHUB_EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID: ${{ vars.EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID || secrets.EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID }}
          EXPO_PUBLIC_EAS_PROJECT_ID: ${{ vars.EXPO_PUBLIC_EAS_PROJECT_ID || secrets.EXPO_PUBLIC_EAS_PROJECT_ID }}
          EXPO_PUBLIC_LIVEKIT_URL: ${{ vars.EXPO_PUBLIC_LIVEKIT_URL || secrets.EXPO_PUBLIC_LIVEKIT_URL || 'wss://quartierplus-98gp8fx8.livekit.cloud' }}
        run: |
          if [ -n "$GITHUB_EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID" ]; then
            if [[ "$GITHUB_EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID" =~ ^[0-9]+-[a-zA-Z0-9-]+\.apps\.googleusercontent\.com$ ]]; then
              export EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID="$GITHUB_EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID"
            else
              unset EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID
            fi
          else
            unset EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID
          fi
          APP_EAS_PROJECT_ID="$(node -p "require('./app.json').expo?.extra?.eas?.projectId?.trim() ?? ''")"
          if [ -n "$APP_EAS_PROJECT_ID" ]; then
            export EXPO_PUBLIC_EAS_PROJECT_ID="$APP_EAS_PROJECT_ID"
          fi
          mkdir -p artifacts
          for architecture in arm64-v8a armeabi-v7a; do
            if [ "$architecture" = "arm64-v8a" ]; then
              profile="preview-arm64"
            else
              profile="preview-armv7"
            fi
            BUILD_JSON="$(eas build --platform android --profile "$profile" --non-interactive --wait --json)"
            BUILD_URL="$(BUILD_JSON="$BUILD_JSON" node <<'NODE'
          const result = JSON.parse(process.env.BUILD_JSON);
          const builds = Array.isArray(result) ? result : [result];
          const build = [...builds].reverse().find((item) => item?.artifacts?.buildUrl);
          const url = build?.artifacts?.buildUrl;
          if (typeof url !== "string" || !url.startsWith("https://")) {
            console.error("EAS n’a pas renvoyé d’URL HTTPS pour l’APK.");
            process.exit(1);
          }
          process.stdout.write(url);
          NODE
            )"
            apk="artifacts/quartierplus-preview-${architecture}.apk"
            printf 'EAS build %s: %s\n' "$architecture" "$BUILD_URL" >> "$GITHUB_STEP_SUMMARY"
            if [ "$architecture" = "arm64-v8a" ]; then
              output_architecture="arm64"
              other_architecture="armeabi-v7a"
            else
              output_architecture="armv7"
              other_architecture="arm64-v8a"
            fi
            printf 'build_url_%s=%s\n' "$output_architecture" "$BUILD_URL" >> "$GITHUB_OUTPUT"
            curl --fail --location --retry 3 --output "$apk" "$BUILD_URL"
            test -s "$apk"
            size="$(stat -c '%s' "$apk")"
            if ! unzip -Z1 "$apk" | grep -q "^lib/${architecture}/"; then
              echo "::error::L’APK $architecture ne contient pas ses bibliothèques natives."
              exit 1
            fi
            if unzip -Z1 "$apk" | grep -Eq "^lib/(x86|x86_64|${other_architecture})/"; then
              echo "::error::L’APK $architecture contient une architecture native inattendue."
              exit 1
            fi
            if unzip -lv "$apk" | awk '$NF ~ /\.so$/ && $2 !~ /^Defl/ { uncompressed = 1 } END { exit uncompressed ? 0 : 1 }'; then
              echo "::error::Une bibliothèque native de $apk n’est pas compressée."
              exit 1
            fi
            if [ "$size" -gt 52428800 ]; then
              echo "::warning::L’APK $architecture dépasse l’objectif de 50 Mo (${size} octets)."
            fi
          done

          printf '\n## Taille APK et 10 plus gros éléments\n\n' >> "$GITHUB_STEP_SUMMARY"
          for architecture in arm64-v8a armeabi-v7a; do
            apk="artifacts/quartierplus-preview-${architecture}.apk"
            size="$(stat -c '%s' "$apk")"
            printf '### %s — %.1f Mo\n\n' "$architecture" "$(awk -v bytes="$size" 'BEGIN { print bytes / 1048576 }')" >> "$GITHUB_STEP_SUMMARY"
            printf '| Taille (Mo) |\n|---:|\n| %.1f |\n\n' \
              "$(awk -v bytes="$size" 'BEGIN { print bytes / 1048576 }')" >> "$GITHUB_STEP_SUMMARY"
            printf '| Élément | Taille décompressée (Mo) |\n|---|---:|\n' >> "$GITHUB_STEP_SUMMARY"
            unzip -l "$apk" | awk 'NR > 3 && $1 ~ /^[0-9]+$/ { printf "%s\t%s\n", $1, $4 }' | sort -nr | head -10 | \
              awk -F '\t' '{ printf "| `%s` | %.2f |\n", $2, $1 / 1048576 }' >> "$GITHUB_STEP_SUMMARY"
            printf '\n' >> "$GITHUB_STEP_SUMMARY"
          done

      - name: Diagnose failed EAS build
        if: ${{ failure() && steps.eas-build.outcome == 'failure' }}
        continue-on-error: true
        working-directory: mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${EXPO_TOKEN:-}" ]; then
            echo "EAS log diagnostic unavailable: EXPO_TOKEN is not configured." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          temp_dir="$(mktemp -d)"
          trap 'rm -rf "$temp_dir"' EXIT
          if ! npx eas-cli build:list --platform android --git-commit-hash "$GITHUB_SHA" --limit 10 --json > "$temp_dir/builds.json" 2>/dev/null; then
            echo "EAS log diagnostic unavailable: build:list failed." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          build_id="$(node - "$temp_dir/builds.json" <<'NODE'
          const fs = require("node:fs");
          try {
            const builds = JSON.parse(fs.readFileSync(process.argv[2], "utf8"));
            const failed = (Array.isArray(builds) ? builds : [])
              .find((build) =>
                build.platform === "ANDROID" &&
                String(build.status).toLowerCase() === "errored"
              );
            if (failed?.id) process.stdout.write(failed.id);
          } catch {
            console.error("EAS build:list returned invalid JSON.");
          }
          NODE
          )"
          if [ -z "$build_id" ]; then
            echo "EAS log diagnostic unavailable: no failed Android build found for this commit." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          if ! npx eas-cli build:view "$build_id" --json > "$temp_dir/build.json" 2>/dev/null; then
            echo "EAS log diagnostic unavailable: build:view failed." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          node - "$temp_dir/build.json" "$temp_dir" <<'NODE'
          const fs = require("node:fs");
          const path = require("node:path");
          const { spawnSync } = require("node:child_process");

          const maxLogBytes = 20 * 1024 * 1024;
          let build;
          try {
            build = JSON.parse(fs.readFileSync(process.argv[2], "utf8"));
          } catch {
            console.log("EAS log diagnostic unavailable: build:view returned invalid JSON.");
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, "EAS log diagnostic unavailable: build:view returned invalid JSON.\n");
            process.exit(0);
          }

          const excerpts = [];
          let downloadedLogs = 0;
          let downloadFailures = 0;
          for (const [index, url] of (Array.isArray(build.logFiles) ? build.logFiles : []).slice(0, 5).entries()) {
            if (typeof url !== "string" || !url.startsWith("https://")) continue;
            const logfile = path.join(process.argv[3], `build-${index}.log`);
            const download = spawnSync("curl", [
              "--fail", "--silent", "--show-error", "--location",
              "--proto", "=https", "--proto-redir", "=https",
              "--max-filesize", String(maxLogBytes), "--output", logfile, url,
            ], { encoding: "utf8", maxBuffer: 1024 * 1024 });
            if (download.status !== 0) {
              downloadFailures++;
              continue;
            }
            downloadedLogs++;

            const lines = fs.readFileSync(logfile, "utf8").split(/\r?\n/);
            const selected = new Set();
            for (let i = 0; i < lines.length; i++) {
              if (!/(what went wrong|execution failed for task|\bFAILED\b|error:)/i.test(lines[i])) continue;
              for (let j = Math.max(0, i - 20); j <= Math.min(lines.length - 1, i + 20); j++) {
                selected.add(j);
              }
            }
            const excerptsForLog = [...selected].sort((a, b) => a - b).slice(0, 160).map((line) => {
              let text = lines[line]
                .replace(/\bBearer\s+[A-Za-z0-9._~+/-]+=*/gi, "Bearer [REDACTED]")
                .replace(/\bAIza[0-9A-Za-z_-]{20,}\b/g, "[REDACTED_API_KEY]")
                .replace(/\beyJ[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+\b/g, "[REDACTED_TOKEN]")
                .replace(/(([a-z0-9_-]*(?:api[_-]?key|token|secret|password)|authorization)\s*[:=]\s*)(?:"[^"]*"|'[^']*'|[^\s,;]+)/gi, "$1[REDACTED]");
              return `${line + 1}: ${text}`;
            });
            if (excerptsForLog.length) excerpts.push(...excerptsForLog);
          }

          const header = `EAS build ${build.id ?? "unknown"} diagnostic excerpts (±20 lines; capped):`;
          const body = excerpts.length
            ? excerpts.slice(0, 200).join("\n")
            : downloadedLogs
              ? "No matching failure markers found in downloaded logs."
              : `No build logs downloaded (${downloadFailures} download failures; ${Array.isArray(build.logFiles) ? build.logFiles.length : 0} log URLs reported).`;
          const output = `${header}\n${body}`.slice(0, 12000);
          for (const line of output.split("\n")) console.log(`| ${line}`);
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `\n### EAS build failure diagnostic\n\n\`\`\`text\n${output}\n\`\`\`\n`);
          NODE

      - name: Publish preview APK GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          EAS_BUILD_URL_ARM64: ${{ steps.eas-build.outputs.build_url_arm64 }}
          EAS_BUILD_URL_ARMV7: ${{ steps.eas-build.outputs.build_url_armv7 }}
        run: |
          RELEASE_TAG="quartierplus-preview-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          gh release create "$RELEASE_TAG" \
            mobile/artifacts/quartierplus-preview-arm64-v8a.apk \
            mobile/artifacts/quartierplus-preview-armeabi-v7a.apk \
            --title "QuartierPlus Android preview ${GITHUB_RUN_NUMBER}" \
            --notes "APK arm64-v8a — build EAS : ${EAS_BUILD_URL_ARM64} ; APK armeabi-v7a — build EAS : ${EAS_BUILD_URL_ARMV7}" \
            --prerelease
          printf 'GitHub Release: https://github.com/%s/releases/tag/%s\n' \
            "$GITHUB_REPOSITORY" "$RELEASE_TAG" >> "$GITHUB_STEP_SUMMARY"
